name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      # Steps below only run if the tests above passed.
      - name: Create build package
        run: |
          mkdir -p dist/package
          cp -r app requirements.txt README.md VERSION dist/package/
          find dist/package -name "__pycache__" -type d -prune -exec rm -rf {} +
          cd dist/package && zip -r ../sdi4213-app.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdi4213-app
          path: dist/sdi4213-app.zip
          if-no-files-found: error
